<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CGMacros Cohort Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c2330;--muted:#6a7487;--grid:#e6e9ef;--accent:#2f6fed;--ok:#2fa36b;--warn:#e9a23b;--bad:#d9534f;--border:#e1e5ec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--card:#1b212b;--text:#e8ecf3;--muted:#98a3b8;--grid:#2a3240;--accent:#6c9bff;--ok:#4cc58a;--warn:#f0b455;--bad:#ef7470;--border:#2a3240;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1250px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:22px;margin:0 0 2px}.sub{color:var(--muted);margin:0 0 14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px}
.bar label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:3px}
select,button,.file{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
button,.file{cursor:pointer}.file input{display:none}
.primary{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}
.status{margin-left:auto;font-size:12px;color:var(--muted);max-width:340px;text-align:right}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{border-radius:20px}.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.kpi .v{font-size:24px;font-weight:650;margin-top:2px}.kpi .s{font-size:11px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 2px}.card .n{color:var(--muted);font-size:12px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:860px){.grid,.grid3{grid-template-columns:1fr}}
.ch{position:relative;height:270px}.ch.tall{height:340px}
.tir{display:flex;height:26px;border-radius:7px;overflow:hidden;margin:8px 0 6px}.tir div{display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;overflow:hidden}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.tw{overflow:auto;max-height:420px}
table{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
th,td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left}
th{position:sticky;top:0;background:var(--card);color:var(--muted);font-weight:600;cursor:pointer;z-index:1}
tbody tr.go{cursor:pointer}tbody tr.go:hover{background:var(--bg)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.chip{display:flex;justify-content:space-between;gap:8px;padding:5px 9px;border-radius:8px;font-size:12px;border:1px solid var(--border)}
.hm td,.hm th{text-align:center;padding:4px 5px;font-size:11px}.hm th{writing-mode:vertical-rl;transform:rotate(180deg);height:150px;white-space:nowrap;vertical-align:bottom}
.hm td:first-child,.hm th:first-child{writing-mode:horizontal-tb;transform:none;height:auto;text-align:left}
.bio{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.bio div{font-size:11px;color:var(--muted)}.bio b{display:block;font-size:16px;color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
<h1>CGMacros Cohort Dashboard</h1>
<p class="sub">45 participants: clinical labs, gut-microbiome profiles and continuous glucose with meal macros. Clinical, gut and microbiome data are built in; load the CGM files to light up glucose views.</p>

</div>
<div class="tabs" id="tabs"></div>
<div id="main"></div>

/* ---------- chart helpers ---------- */

/* ---------- tabs ---------- */

/* ---------- cohort ---------- */

  const so=S.sort,sc=cols.find(c=>c[0]===so.k)||cols[0];
  const rows=[...bio].sort((a,b)=>{const x=sc[2](a),y=sc[2](b);if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*so.d;});

function explore(){
  const opts=sel=>{const g={};VARS.forEach(v=>(g[v.grp]=g[v.grp]||[]).push(v));return Object.entries(g).map(([k,a])=>`<optgroup label="${k}">${a.map(v=>`<option value="${v.key}"${v.key===sel?" selected":""}>${v.label}</option>`).join("")}</optgroup>`).join("");};
  $("main").innerHTML=`<div class="card"><div class="bar" style="border:0;padding:0;margin:0 0 8px"><label>X axis<select id="ex">${opts(S.ex.x)}</select></label><label>Y axis<select id="ey">${opts(S.ex.y)}</select></label>
   <label>Color by<select id="ec"><option value="sex">Sex</option><option value="stat">Glycemic status</option><option value="none">None</option></select></label></div>
   <h2 id="et"></h2><div class="n" id="en"></div><div class="ch tall" style="height:460px"><canvas id="e1"></canvas></div></div>`;

    S.ex={x:$("ex").value,y:$("ey").value,c:$("ec").value};const X=V_(S.ex.x),Y=V_(S.ex.y);

    const r=corr(pts.map(p=>p.x),pts.map(p=>p.y));

    $("en").textContent=pts.length<3?"Not enough data (load CGM files for CGM variables).":`n = ${pts.length} · Pearson r = ${r==null?"–":r.toFixed(2)} · click a point to open the participant`;
    const key=S.ex.c,grp=key==="none"?[["All",()=>true,css("--accent")]]:(key==="sex"?["F","M"]:["Normal","Prediabetes","Diabetes"]).map(g=>[g,p=>B[p.s][key]===g,SC[g]]);
    const ds=grp.map(([l,fn,c])=>({label:l==="F"?"Female":l==="M"?"Male":l,data:pts.filter(fn),backgroundColor:c,pointRadius:6,pointHoverRadius:8}));
    if(pts.length>2){const mx=mean(pts.map(p=>p.x)),my=mean(pts.map(p=>p.y)),b=pts.reduce((a,p)=>a+(p.x-mx)*(p.y-my),0)/pts.reduce((a,p)=>a+(p.x-mx)**2,0),xs=pts.map(p=>p.x),x0=Math.min(...xs),x1=Math.max(...xs);
      if(isFinite(b))ds.push({type:"line",label:"Trend",data:[{x:x0,y:my+b*(x0-mx)},{x:x1,y:my+b*(x1-mx)}],borderColor:css("--muted"),borderDash:[5,5],borderWidth:1.5,pointRadius:0});}
    mk("e1",{type:"scatter",data:{datasets:ds},options:{...base(),onClick:(e,els)=>{const el=els[0];if(el){const p=ds[el.datasetIndex].data[el.index];if(p&&p.s)openP(p.s);}},
      scales:{x:{...gridc(),title:{display:true,text:X.label}},y:{...gridc(),title:{display:true,text:Y.label}}},plugins:{legend:{position:"bottom"},tooltip:{callbacks:{label:c=>c.raw.s?`#${c.raw.s}: ${f(c.raw.x,2)}, ${f(c.raw.y,2)}`:""}}}}});
  };
  ["ex","ey","ec"].forEach(i=>$(i).onchange=draw);draw();
}

/* ---------- participant ---------- */

   <label>Day<select id="pd"><option value="all">All days (${days.length})</option>${days.map(d=>`<option${d===S.day?" selected":""}>${d}</option>`).join("")}</select></label>

  const mp=V.meals.map(m=>{const n=V.g.reduce((a,x)=>Math.abs(x.t-m.t)<Math.abs(a.t-m.t)?x:a,V.g[0]);return{x:m.t,y:n.v,m};});
  const band={id:"band",beforeDatasetsDraw(c){const{ctx,chartArea:a,scales:{y}}=c;ctx.save();ctx.fillStyle="rgba(47,163,107,.12)";const y1=y.getPixelForValue(H);ctx.fillRect(a.left,y1,a.right-a.left,y.getPixelForValue(L)-y1);ctx.restore();}};

  if(S.ov)ds.push({label:"Other sensor",data:line.filter(x=>x.o!=null).map(x=>({x:x.t,y:x.o})),borderColor:"#8b94a5",borderDash:[3,3],borderWidth:1,pointRadius:0});
  ds.push({label:"Meals",type:"scatter",data:mp,pointRadius:6,pointHoverRadius:8,pointBackgroundColor:mp.map(p=>TC[p.m.type]),pointBorderColor:"#fff",pointBorderWidth:1.5});
  mk("c1",{type:"line",plugins:[band],data:{datasets:ds},options:{...base(),parsing:false,interaction:{mode:"nearest",intersect:true},scales:{x:{type:"linear",...gr,ticks:{maxTicksLimit:9,callback:fmt}},y:{...gr,title:{display:true,text:"mg/dL"}}},
    plugins:{legend:{display:false},tooltip:{callbacks:{title:i=>fmt(i[0].raw.x),label:c=>{const r=c.raw;if(r.m){const m=r.m;return[`${m.type}: ${f(m.cal)} kcal`,`Carbs ${f(m.carb)} g · Protein ${f(m.prot)} g`,`Fat ${f(m.fat)} g · Fiber ${f(m.fib)} g`,m.delta!=null?`Spike +${f(m.delta)} mg/dL`:""].filter(Boolean);}return f(r.y)+" mg/dL";}}}}}});
  const hrs=Array.from({length:24},(_,h)=>V.g.filter(x=>new Date(x.t).getHours()===h).map(x=>x.v)),hmn=hrs.map(mean),hs=hrs.map(a=>sd(a)||0);
  mk("c2",{type:"line",data:{labels:hrs.map((_,i)=>String(i).padStart(2,"0")+":00"),datasets:[{data:hmn.map((v,i)=>v==null?null:v+hs[i]),borderWidth:0,pointRadius:0,backgroundColor:"rgba(47,111,237,.15)",fill:"+1",tension:.3},{data:hmn,borderColor:css("--accent"),borderWidth:2.4,pointRadius:0,tension:.3},{data:hmn.map((v,i)=>v==null?null:v-hs[i]),borderWidth:0,pointRadius:0,tension:.3}]},options:{...base(),scales:{x:{...gr,ticks:{maxTicksLimit:8}},y:gr},plugins:{legend:{display:false}}}});
  const types=[...TYPES,"Other"].filter(t=>V.meals.some(x=>x.type===t)),av=k=>types.map(t=>mean(V.meals.filter(x=>x.type===t&&x[k]!=null).map(x=>x[k]))||0),dm=V.meals.filter(x=>x.delta!=null);
  mk("c3",{type:"bar",data:{labels:types,datasets:[["carb","Carbs","#e9a23b"],["prot","Protein","#d9534f"],["fat","Fat","#3b9ae9"],["fib","Fiber","#3fb68b"]].map(([k,l,c])=>({label:l,data:av(k),backgroundColor:c}))},options:{...base(),scales:{x:{...gr,stacked:true},y:{...gr,stacked:true}},plugins:{legend:{position:"bottom"}}}});
  const cx=dm.filter(x=>x.carb!=null),r=corr(cx.map(x=>x.carb),cx.map(x=>x.delta));
  $("rn").textContent=r==null?"Not enough meals for a correlation":`Pearson r = ${r.toFixed(2)} across ${cx.length} meals`;
  mk("c4",{type:"scatter",data:{datasets:types.map(t=>({label:t,data:cx.filter(x=>x.type===t).map(x=>({x:x.carb,y:x.delta})),backgroundColor:TC[t],pointRadius:5}))},options:{...base(),scales:{x:{...gr,title:{display:true,text:"Carbs (g)"}},y:{...gr,title:{display:true,text:"Spike (mg/dL)"}}},plugins:{legend:{position:"bottom"}}}});
  bars("c5",types,types.map(t=>mean(dm.filter(x=>x.type===t).map(x=>x.delta))||0),types.map(t=>TC[t]));
}
